# SmartData runtime configuration.
#
# SmartData reads this file from the process working directory as
# <module-name>_config.properties, i.e. /opt/payara/SmartData_config.properties
# in the container. Missing values fall back to the JNDI data source
# jdbc/SmartData and a PostgreSQL backend.
#
# Uncomment and adapt to switch to MongoDB or to use another JNDI data source.

debugmode=false
#postgres.jndi=jdbc/SmartData
#mongo.url=mongodb://mongo:27017
#mongo.database=smartdata
