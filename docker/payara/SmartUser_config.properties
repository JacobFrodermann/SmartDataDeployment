# SmartUser runtime configuration.
#
# SmartUser reads this file from the process working directory as
# <module-name>_config.properties, i.e. /opt/payara/SmartUser_config.properties
# in the container.
#
# Without passwordsalt and authtokensalt every endpoint that builds a
# Usermanager (login, user list, user creation) fails with HTTP 412:
#   "Missing passwordsalt and / or authtokensalt in configuration."
#
# IMPORTANT: These are development defaults. Changing the salts invalidates all
# stored password hashes and auth tokens. Replace them with your own values
# before using the stack for anything real, and keep them stable afterwards.

passwordsalt=change-me-smartuser-password-salt
authtokensalt=change-me-smartuser-authtoken-salt
confirmsalt=change-me-smartuser-confirm-salt

# Required. Without serviceorder the UsermanagerBuilder throws a
# NullPointerException and login returns HTTP 500.
#
# local       - users are stored in the SmartUser database (default here)
# ldap        - users are resolved via LDAP (needs ldap_* settings)
# network     - users are resolved via another SmartUser instance (smartuser.url)
# networklocal- local with network fallback
serviceorder=local

# Required. UsermanagerLocal.createUser() dereferences the value of
# confirm_mail without a null check, so leaving it unset makes user creation
# fail with a NullPointerException (HTTP 500). Set it to true only when the
# email_smtp_* settings are configured.
confirm_mail=false

debugmode=false

# Optional, only needed for LDAP or mail based user management:
#ldap_url=
#ldap_basedn=
#email_smtp_host=
#email_smtp_port=
#email_smtp_user=
#email_smtp_password=
#email_smtp_sender=
