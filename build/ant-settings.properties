# Ant property overrides for the upstream NetBeans builds (AGENTS.md section 4).
#
# The upstream nbproject/build-impl.xml files reference IDE-owned properties
# that are normally defined by a NetBeans installation. This file supplies
# them so the builds run headless with plain Apache Ant:
#
#   scripts/build_war.sh <Name> -propertyfile build/ant-settings.properties dist
#
# All paths are inside the ant-builder container (/opt/ant-builder/libs) and on
# the host (--host-ant mode maps them 1:1 to build/libs).

# Jakarta EE 10 platform API, compile-time only. Payara provides the
# implementation at runtime; the upstream -post-dist target strips the jar
# from the WAR.
j2ee.platform.classpath=/opt/ant-builder/libs/jakarta.jakartaee-api-10.0.0.jar
libs.jakartaee-api-10.0.classpath=/opt/ant-builder/libs/jakarta.jakartaee-api-10.0.0.jar

# NetBeans CopyLibs Ant task, required by build-impl.xml -init-taskdefs.
# Not published on Maven Central; vendored from a NetBeans installation
# (see build/libs/libs.sha256 for provenance).
libs.CopyLibs.classpath=/opt/ant-builder/libs/org-netbeans-modules-java-j2seproject-copylibstask.jar

# Do not let the build Ant-build the four Smart* helper projects from sibling
# checkouts (../NGI_Logger etc.). The vendored jars below replace them.
no.dependencies=true

# Vendored Smart* helper jars. Byte-identical copies exist in all three
# application repositories' libs/maven-repo/ trees (SHA256 verified); these
# are the artifacts the Maven builds shipped with.
reference.NGI_RestUtils.jar=/opt/ant-builder/libs/NGI_RestUtils-1.0.0.jar
reference.NGI_Logger.jar=/opt/ant-builder/libs/NGI_Logger-1.0.0.jar
reference.NGI_AdvancedReflection.jar=/opt/ant-builder/libs/NGI_AdvancedReflection-1.0.0.jar
reference.SmartUserAuth.jar=/opt/ant-builder/libs/SmartUserAuth-1.0.0.jar
